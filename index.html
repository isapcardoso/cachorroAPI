<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buscar cachorro aleatório</title>

    <style>
        body{
            background-color: rgba(255, 162, 235, 0.741);
            text-align: center;

         
        }
        h1{
            font-size: 40px;
            color: rgb(255, 83, 186);
            border: 2px dashed rgb(250, 182, 241);
            text-align: center;
            background-color: rgb(249, 250, 215);
            margin-bottom: 30xp;
            box-shadow: 4px 5px 10px gray;
            border-radius: 15px;
            font-family: 'Times New Roman', Times, serif;
        }

        img{
            display: block;
            margin: 0 auto;
            margin-bottom: 50px auto 0;
            border: 3px dashed rgb(249, 255, 77);
            background-color: bisque;
        }

        button{
            color: palevioletred;
            background-color: bisque;
            height: 50px;
            width: 200px;
            font-size: medium;
            margin-bottom: 20px;
        }

    </style>


  </head>
  <body>
    <h1>Buscar Cachorro</h1>

    <button id="buscar">Mostrar cachorro</button>

    <div>
      <img id="cachorro" alt="Foto aleatória" width="300" height="200">
    </div>

    <script src="script.js"></script>
  </body>
</html>
